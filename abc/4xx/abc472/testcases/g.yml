---
type: Batch
timelimit: ~
match: Lines

cases:
  - name: sample1
    in: |
      2 3
      +-+
      --+
    out: |
      1
  - name: sample2
    in: |
      3 3
      +--
      -#-
      #+#
    out: |
      1
  - name: sample3
    in: |
      5 7
      ++#--++
      -+---+#
      ##++-++
      --#-++-
      +---#++
    out: |
      5

extend:
  - type: Text
    path: "./g"
    in: /in/*.txt
    out: /out/*.txt
