---
type: Batch
timelimit: ~
match: Lines

cases:
  - name: sample1
    in: |
      4 2
      2 4 3 1
      3
      2
    out: |
      4 1 3 2
  - name: sample2
    in: |
      3 3
      1 2 3
      1
      1
      1
    out: |
      2 3 1
  - name: sample3
    in: |
      2 5
      2 1
      1
      1
      2
      2
      1
    out: |
      2 1

extend:
  - type: Text
    path: "./c"
    in: /in/*.txt
    out: /out/*.txt
